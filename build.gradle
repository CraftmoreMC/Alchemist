plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven { url = "https://maven.nucleoid.xyz" }
	mavenCentral()
}

fabricApi {
	// "gradlew runDatagen" regenerates src/main/generated
	configureDataGeneration {
		outputDirectory = file("src/main/generated")
		modId = project.modid
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation include("maven.modrinth:pal:${pal_version}")
	// Trinkets Updated (Patbox's fork), plus its Polymer patch so vanilla clients can join
	implementation "maven.modrinth:trinkets-updated:${trinkets_version}"
	runtimeOnly "maven.modrinth:trinkets-polymer:${trinkets_polymer_version}"
	runtimeOnly "eu.pb4:polymer-resource-pack-extras:${polymer_version}" // needed by the trinkets polymer patch

	//Polymer
	implementation include("eu.pb4:polymer-core:${polymer_version}")
	implementation include("eu.pb4:polymer-virtual-entity:${polymer_version}")
	implementation include("eu.pb4:polymer-blocks:${polymer_version}")
	implementation include("eu.pb4:polymer-resource-pack:${polymer_version}")
	implementation include("eu.pb4:polymer-autohost:${polymer_version}") // sends the resource pack to players on join

	//Lombok
	compileOnly "org.projectlombok:lombok:${lombok_version}"
	annotationProcessor "org.projectlombok:lombok:${lombok_version}"

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
